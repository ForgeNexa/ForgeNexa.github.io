name: Deploy ForgeNexa Website to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      google_site_verification:
        description: 'Google Search Console Verification Token'
        required: false
        default: ''

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Bun Environment
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Inject Google Search Console Verification Token
        run: |
          TOKEN="${{ inputs.google_site_verification || secrets.GOOGLE_SITE_VERIFICATION }}"
          if [ -n "$TOKEN" ]; then
            echo "Injecting Google Site Verification Token into index.html..."
            sed -i.bak "s/verification-token-placeholder/$TOKEN/g" index.html
            rm -f index.html.bak
          fi

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Run Data Integrity & Unit Tests
        run: bun test

      - name: Run TypeScript Checks
        run: bun run typecheck

      - name: Build Static Production Web Assets
        run: bun run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
